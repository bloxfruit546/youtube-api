name: build

on:
  push:
  workflow_dispatch:

jobs:
  deb:
    # Not ubuntu-latest: on 24.04 the prebuilt cross-toolchain fails to exec
    # ("No such file or directory", exit 127) because its loader/libs are gone.
    # 22.04 is the version that toolchain was actually built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot dpkg-dev rsync curl perl \
                                  zip git libxml2 xz-utils libtinfo6 libz3-dev
          # The prebuilt clang wants libncurses/libtinfo 5; present on jammy only.
          sudo apt-get install -y libtinfo5 || true

          THEOS="$HOME/theos"
          # --recursive: vendor/ (logos, substrate headers + lib, dm.pl) are submodules.
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          # That sdks submodule is a bare .keep; use the real SDK repo.
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          chmod +x "$THEOS/bin/"* 2>/dev/null || true

          # Host clang cannot emit arm64 Mach-O, so the cross-toolchain is
          # mandatory. The archive root already contains linux/iphone/, so it
          # must land directly in $THEOS/toolchain (not toolchain/linux).
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$THEOS/toolchain"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      # Fail here with a readable message instead of exit 127 inside make.
      - name: Verify toolchain
        run: |
          $THEOS/toolchain/linux/iphone/bin/clang --version
          $THEOS/toolchain/linux/iphone/bin/ldid -h >/dev/null

      - name: Self-check sources
        run: python3 scratch/selfcheck.py

      - name: Build package
        run: make package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: PhotographicStyles16-deb
          path: "**/packages/*.deb"
          if-no-files-found: error
